<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "C:/path/to/your/public"

    <Directory "C:/path/to/your/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Ensure mod_proxy and mod_proxy_fcgi are enabled in your Apache httpd.conf
    <FilesMatch \.php$>
        # Forward requests directly to your Go application proxy on port 9000
        # Note: Do not change the port, as it is currently hardcoded to listen on 9000
        SetHandler "proxy:fcgi://127.0.0.1:9000"
    </FilesMatch>

    ErrorLog "logs/mini-fpm_error.log"
    CustomLog "logs/mini-fpm_access.log" combined
</VirtualHost>